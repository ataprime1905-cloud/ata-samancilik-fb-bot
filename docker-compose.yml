services:
  postgres:
    image: postgres:16-alpine
    container_name: atasam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: atasam
      POSTGRES_PASSWORD: atasam
      POSTGRES_DB: atasam
    ports:
      - "5432:5432"
    volumes:
      - atasam-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atasam -d atasam"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: atasam-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - atasam-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  atasam-postgres-data:
  atasam-redis-data:
